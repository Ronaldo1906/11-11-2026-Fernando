<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block titulo %}ALQUILAPC{% endblock %}</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, Arial, sans-serif; margin: 0; background: #f3f5f4; color: #1d2b22; }
    header { background: #be38cf; color: #fff; padding: 14px 24px; display: flex; justify-content: space-between; align-items: center; }
    header a { color: #fff; margin-left: 16px; text-decoration: none; font-weight: 600; }
    main { max-width: 760px; margin: 24px auto; background: #fff; padding: 24px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.1); }
    label { display: block; margin-top: 12px; font-weight: 600; }
    input, select { width: 100%; padding: 8px; margin-top: 4px; border: 1px solid #b9c4bc; border-radius: 4px; font-size: 15px; }
    button, .btn { margin-top: 18px; background: #be38cf; color: #fff; border: 0; padding: 10px 18px; border-radius: 4px; cursor: pointer; font-size: 15px; text-decoration: none; display: inline-block; }
    .errores { background: #fdecea; color: #a12622; padding: 10px 16px; border-radius: 4px; }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; }
    th, td { padding: 8px; border-bottom: 1px solid #e2e7e3; text-align: left; }
    td.num { text-align: right; }
    .total td { font-weight: 700; font-size: 1.1em; }
    @media print { header, .no-print { display: none; } main { box-shadow: none; } }
  </style>
</head>
<body>
  <header>
    <strong>ALQUILAPC</strong>
    <nav><a href="{{ url_for('index') }}">Liquidar</a><a href="{{ url_for('listar_servicios') }}">Consultar</a></nav>
  </header>
  <main>{% block contenido %}{% endblock %}</main>
</body>
</html>
